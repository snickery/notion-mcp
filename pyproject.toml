[project]
name = "notion-mcp"
version = "0.2.2"
description = "MCP server for Notion: pages, databases, markdown, comments, and a full file pipeline"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Nick Engel", email = "nick@engel.au" }]
requires-python = ">=3.12"
keywords = ["mcp", "model-context-protocol", "notion", "markdown", "files"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business",
]
dependencies = [
    # The kit pins the MCP SDK range (mcp<2) for every server built on it.
    # [pdf]: notion_extract_file_text / notion_render_file_page (pdfplumber, pypdfium2,
    # pillow; OCR via an xberg server over httpx).
    "mcp-server-kit[pdf]>=0.1.1,<0.2",
    "mcp[cli]>=1.0.0",
    "httpx>=0.27.0",
    "google-auth>=2.35.0",
    "google-auth-httplib2>=0.2.0",
    "google-api-python-client>=2.150.0",
]

[project.urls]
Homepage = "https://github.com/snickery/notion-mcp"
Issues = "https://github.com/snickery/notion-mcp/issues"

[project.scripts]
notion-mcp = "notion_mcp.server:main"

[project.optional-dependencies]
test = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/notion_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires NOTION_TEST_TOKEN (live API tests)",
]
